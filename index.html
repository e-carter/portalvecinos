        req.onsuccess = function(){ resolve(req.result || null); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return null; });
  }
  function idbSetHandle(handle){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){});
  }
  function idbClearHandle(){
    return idbOpen().then(function(db){
      return new Promise(function(resolve){
        var tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(IDB_KEY);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ resolve(); };
      });
    }).catch(function(){});
  }

  function writeStateToLocalFile(){
    if(!fsHandle || fsStatus==='reconnect') return Promise.resolve();
    return fsHandle.createWritable().then(function(writable){
      return writable.write(JSON.stringify(STATE, null, 2)).then(function(){
        return writable.close();
      });
    }).catch(function(err){
      if(err && err.name==='NotAllowedError'){
        fsStatus = 'reconnect';
      } else {
        toast('No se pudo guardar el archivo local (¿se movió, se renombró o se eliminó?).');
      }
      render();
    });
  }

  function connectLocalFile(){
    if(!fsSupported){
      toast('Conectar un archivo automáticamente requiere Chrome o Edge en tu computador.');
      return;
    }
    window.showSaveFilePicker({
      suggestedName: 'estado.json',
      types: [{ description: 'Datos (JSON)', accept: {'application/json': ['.json']} }]
    }).then(function(handle){
      fsHandle = handle; fsFileName = handle.name; fsStatus = 'connected';
      idbSetHandle(handle);
      return writeStateToLocalFile();
    }).then(function(){
      render();
      toast('Archivo conectado. Los datos se guardarán ahí automáticamente.');
    }).catch(function(err){
      if(err && err.name!=='AbortError'){ toast('No se pudo conectar el archivo.'); }
    });
  }

  function reconnectLocalFile(){
    if(!fsHandle) return;
    fsHandle.requestPermission({mode:'readwrite'}).then(function(perm){
      if(perm==='granted'){
        fsStatus = 'connected';
        render();
        writeStateToLocalFile();
        toast('Archivo reconectado.');
      } else {
        toast('No se concedió permiso para escribir en el archivo.');
      }
    }).catch(function(){ toast('No se pudo reconectar el archivo.'); });
  }

  function disconnectLocalFile(){
    fsHandle = null; fsFileName = ''; fsStatus = 'none';
    idbClearHandle();
    render();
    toast('Archivo desconectado.');
  }

  /* ---------- sincronización en la nube (Firebase Realtime Database) ---------- */
  function firebaseUrl(){
    return FIREBASE_CONFIG.url.replace(/\/$/, '') + '/' + FIREBASE_CONFIG.path + '.json';
  }
  function fetchFirebaseState(){
    return fetch(firebaseUrl(), {cache:'no-store'}).then(function(resp){
      if(!resp.ok){ var err = new Error('http-'+resp.status); err.status = resp.status; throw err; }
      return resp.json();
    }).then(function(data){
      return (data && Array.isArray(data.houses)) ? data : null;
    });
  }
  function writeFirebaseState(){
    return fetch(firebaseUrl(), {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(STATE)
    }).then(function(resp){
      if(!resp.ok){ throw new Error('http-'+resp.status); }
    });
  }
  function startFirebasePolling(){
    if(firebasePollTimer){ clearInterval(firebasePollTimer); }
    firebasePollTimer = setInterval(function(){
      var editing = ui.addOpen || ui.editingHouse || ui.changePwOpen || ui.confirmDeleteHouse || ui.confirmDeletePayment || ui.importPending || ui.confirmDeleteHouseYear || ui.confirmDeleteGasto || ui.confirmDeleteIngreso;
      if(editing) return;
      fetchFirebaseState().then(function(remote){
        firebaseOk = true;
        if(remote && JSON.stringify(remote)!==JSON.stringify(STATE)){
          STATE = remote;
          render();
        }
      }).catch(function(){ firebaseOk = false; render(); });
    }, 20000);
  }
  function initFirebaseSync(){
    fetchFirebaseState().then(function(remote){
      firebaseChecked = true;
      firebaseOk = true;
      if(remote){
        STATE = remote;
        render();
      } else {
        // Todavía no hay datos en la nube: sube el estado ORIGINAL con el que
        // se publicó esta página (no una copia que pudiera haber quedado
        // guardada en este navegador de una sesión o prueba anterior).
        STATE = EMBEDDED_SEED_STATE;
        writeFirebaseState().catch(function(){});
        render();
      }
      startFirebasePolling();
    }).catch(function(){
      firebaseChecked = true;
      firebaseOk = false;
      render();
      startFirebasePolling(); // sigue reintentando en segundo plano
    });
  }

  function initStandaloneData(){
    fsSupported = (typeof window.showSaveFilePicker === 'function');
    var local = loadLocalFallback();
    if(local){ STATE = local; }
    render();

    if(firebaseConfigured){
      initFirebaseSync();
      return;
    }

    idbGetHandle().then(function(handle){
      if(!handle) return null;
      fsHandle = handle; fsFileName = handle.name;
      return handle.queryPermission({mode:'readwrite'}).then(function(perm){
        if(perm==='granted'){
          fsStatus = 'connected';
          return handle.getFile().then(function(f){ return f.text(); }).then(function(text){
            var parsed = JSON.parse(text);
            return (parsed && Array.isArray(parsed.houses)) ? parsed : null;
          }).catch(function(){ return null; });
        }
        fsStatus = 'reconnect';
        return null;
      });
    }).catch(function(){ return null; }).then(function(fromFile){
      if(fromFile){ STATE = fromFile; render(); return; }
      if(fsStatus==='connected'){ render(); return; }
      // Sin archivo local conectado (o aún sin leerlo): intenta leer un
      // estado.json junto a esta página — así una copia publicada en
      // GitHub Pages muestra los últimos datos que subió el administrador.
      fetch('estado.json', {cache:'no-store'}).then(function(resp){
        if(!resp.ok) throw 0;
        return resp.json();
      }).then(function(parsed){
        if(parsed && Array.isArray(parsed.houses)){ STATE = parsed; render(); }
      }).catch(function(){ /* sin estado.json disponible aún; se mantienen los datos actuales */ });
    });
  }

  /* ---------- helpers ---------- */
  function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtMoney(n){
    n = Number(n)||0;
    try{
      return new Intl.NumberFormat('es-CL', {style:'currency', currency: (STATE.meta&&STATE.meta.currency)||'CLP', maximumFractionDigits:0}).format(n);
    }catch(e){ return '$' + Math.round(n).toString(); }
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1);
  }
  function monthLabel(periodo){
    if(!periodo) return '';
    var parts = periodo.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    var s = new Intl.DateTimeFormat('es-CL', {month:'long', year:'numeric'}).format(d);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function dateLabel(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return new Intl.DateTimeFormat('es-CL', {day:'2-digit', month:'short', year:'numeric'}).format(d);
  }
  function houseTotal(h){
    return (h.payments||[]).reduce(function(sum,p){ return sum + (Number(p.monto)||0); }, 0);
  }
  function monthsCovered(h){
    var set = {};
    (h.payments||[]).forEach(function(p){ if(p.periodo) set[p.periodo]=true; });
    return Object.keys(set).sort();
  }
  function houseStatus(h){
    var mc = monthsCovered(h);
    if(mc.length===0) return 'sin-pagos';
    return mc.indexOf(currentMonthKey())>=0 ? 'al-dia' : 'pendiente';
  }
  function sortedPayments(h){
    return (h.payments||[]).slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });
  }
  function getHouse(id){
    return STATE.houses.find(function(h){ return h.id===id; });
  }
  function monthsOfYear(year){
    var out = [];
    for(var m=1;m<=12;m++){ out.push(year + '-' + pad(m)); }
    return out;
  }
  function monthShortLabel(periodo){
    var parts = periodo.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    var s = new Intl.DateTimeFormat('es-CL', {month:'short'}).format(d).replace('.','');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function monthsStatusStrip(h, year, withSwitcher){
    year = year || currentYearNumber();
    var covered = {};
    monthsCovered(h).forEach(function(m){ covered[m] = true; });
    var months = monthsOfYear(year);
    var headerHtml = withSwitcher
      ? ('<div style="display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1rem;">'+
          '<div class="hint" style="margin:0;">Cuotas '+year+'</div>'+yearSwitcherHtml()+
        '</div>')
      : ('<div class="hint" style="margin-top:1rem;">Cuotas '+year+'</div>');
    return (
      headerHtml+
      '<div class="months-strip">' + months.map(function(m){
        var paid = !!covered[m];
        return (
          '<div class="month-chip '+(paid?'paid':'unpaid')+'">'+
            '<span class="mc-icon">'+(paid?ICON.check:ICON.dash)+'</span>'+
            '<span class="mc-label">'+escapeHtml(monthShortLabel(m))+'</span>'+
          '</div>'
        );
      }).join('') + '</div>'
    );
  }
  function monthPickerHtml(name, selectedList, year){
    year = year || currentYearNumber();
    var months = monthsOfYear(year);
    return '<div class="month-picker">' + months.map(function(m){
      var checked = selectedList.indexOf(m)>=0;
      return (
        '<label class="month-pick-chip">'+
          '<input type="checkbox" name="'+name+'" value="'+m+'"'+(checked?' checked':'')+'>'+
          '<span>'+escapeHtml(monthShortLabel(m))+'</span>'+
        '</label>'
      );
    }).join('') + '</div>';
  }

  /* ---------- años, cuotas por año y gastos ---------- */
  function currentMonthNumber(){ return new Date().getMonth()+1; }
  function currentYearNumber(){ return new Date().getFullYear(); }
  function monthsElapsedInYear(year){
    var current = currentYearNumber();
    if(year < current) return 12;
    if(year > current) return 0;
    return currentMonthNumber();
  }
  function houseExpectedToDate(h, year){
    year = year || currentYearNumber();
    return (Number(h.cuota)||0) * monthsElapsedInYear(year);
  }
  function housePaidInYear(h, year){
    year = year || currentYearNumber();
    var y = String(year);
    return (h.payments||[]).filter(function(p){ return (p.periodo||'').indexOf(y+'-')===0; })
      .reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0);
  }
  function houseMonthsPaidInYear(h, year){
    year = year || currentYearNumber();
    var y = String(year);
    var set = {};
    (h.payments||[]).forEach(function(p){ if((p.periodo||'').indexOf(y+'-')===0) set[p.periodo]=true; });
    return Object.keys(set).length;
  }
  function gastoYear(g){ return (g.fecha||'').slice(0,4); }
  function totalGastosList(list){
    return (list||[]).reduce(function(s,g){ return s + (Number(g.monto)||0); }, 0);
  }
  function ingresoYear(g){ return (g.fecha||'').slice(0,4); }
  var totalIngresosList = totalGastosList;
  function availableYears(){
    var set = {};
    var current = currentYearNumber();
    for(var y=current-5; y<=current; y++){ set[y] = true; }
    (STATE.houses||[]).forEach(function(h){
      (h.payments||[]).forEach(function(p){
        var y = parseInt((p.periodo||'').slice(0,4), 10);
        if(y) set[y] = true;
      });
    });
    (STATE.gastos||[]).forEach(function(g){
      var y = parseInt(gastoYear(g), 10);
      if(y) set[y] = true;
    });
    (STATE.ingresos||[]).forEach(function(g){
      var y = parseInt(ingresoYear(g), 10);
      if(y) set[y] = true;
    });
    return Object.keys(set).map(Number).sort(function(a,b){ return b-a; });
  }
  function yearSwitcherHtml(){
    var years = availableYears();
    var current = ui.selectedYear;
    if(years.indexOf(current)===-1){ years.push(current); years.sort(function(a,b){ return b-a; }); }
    return '<select data-action="select-year" aria-label="Año" style="width:auto;display:inline-block;">'+
      years.map(function(y){ return '<option value="'+y+'"'+(y===current?' selected':'')+'>'+y+'</option>'; }).join('')+
    '</select>';
  }

  /* ---------- RUT (Chilean national ID) ---------- */
  function normalizeRut(input){
    if(!input) return '';
    var clean = String(input).toUpperCase().replace(/[^0-9K]/g, '');
    if(clean.length < 2) return '';
    return clean.slice(0, -1) + '-' + clean.slice(-1);
  }
  function computeRutDV(body){
    var sum = 0, mul = 2;
    for(var i = body.length - 1; i >= 0; i--){
      sum += parseInt(body.charAt(i), 10) * mul;
      mul = mul === 7 ? 2 : mul + 1;
    }
    var res = 11 - (sum % 11);
    if(res === 11) return '0';
    if(res === 10) return 'K';
    return String(res);
  }
  function isValidRut(normalized){
    if(!normalized) return false;
    var parts = normalized.split('-');
    var body = parts[0], dv = parts[1];
    if(!body || !dv || !/^[0-9]+$/.test(body)) return false;
    return computeRutDV(body) === dv;
  }
  function formatRutDisplay(normalized){
    if(!normalized) return '';
    var parts = normalized.split('-');
    var body = parts[0], dv = parts[1];
    var withDots = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return withDots + '-' + dv;
  }
  function findHouseByRut(normalized){
    return STATE.houses.find(function(h){ return h.rut===normalized; });
  }
  function runConsultaSearch(rutInput){
    var norm = normalizeRut(rutInput);
    if(!isValidRut(norm)){
      ui.consulta = { rut:rutInput, status:'error', houseId:null, message:'Ingresa un RUT válido, por ejemplo 12.345.678-5.' };
      return;
    }
    var foundHouse = findHouseByRut(norm);
    ui.consulta = foundHouse
      ? { rut:rutInput, status:'found', houseId:foundHouse.id, message:'' }
      : { rut:rutInput, status:'notfound', houseId:null, message:'' };
  }
  function maybeRestoreConsultaSearch(){
    if(consultaAutoRestoreDone) return;
    var hash = (location.hash||'').replace(/^#\/?/, '');
    if(hash!=='consulta'){ consultaAutoRestoreDone = true; return; }
    if(ui.consulta.status!=='idle') return;
    // Espera a que terminen de resolverse los datos (panel de Claude o nube) para
    // no mostrar "no encontrado" un instante antes de que lleguen los datos reales.
    if(!artifactChecked) return;
    if(!artifactNS && firebaseConfigured && !firebaseChecked) return;
    consultaAutoRestoreDone = true;
    var saved = null;
    try{ saved = sessionStorage.getItem(CONSULTA_LAST_RUT_KEY); }catch(e){}
    if(saved){ runConsultaSearch(saved); }
  }
  function validateHouseForm(data, excludeId){
    if(!data.numero || !data.numero.trim()) return { ok:false, message:'Ingresa el número o nombre de la casa.' };
    if(!data.responsable || !data.responsable.trim()) return { ok:false, message:'Ingresa el nombre del responsable.' };
    if(data.cuota==='' || isNaN(Number(data.cuota)) || Number(data.cuota)<0) return { ok:false, message:'Ingresa una cuota mensual válida.' };
    var normalizedRut = normalizeRut(data.rut||'');
    if(!isValidRut(normalizedRut)) return { ok:false, message:'El RUT ingresado no es válido. Revisa el número y el dígito verificador (ej: 12.345.678-5).' };
    var dupe = STATE.houses.some(function(h){ return h.rut===normalizedRut && h.id!==excludeId; });
    if(dupe) return { ok:false, message:'Ya hay una casa registrada con ese RUT.' };
    return { ok:true, rut:normalizedRut };
  }

  /* ---------- views ---------- */
  function renderHome(){
    var houses = STATE.houses;
    var totalHist = houses.reduce(function(s,h){ return s + houseTotal(h); }, 0);
    var mKey = currentMonthKey();
    var totalMes = houses.reduce(function(s,h){
      return s + (h.payments||[]).filter(function(p){ return p.periodo===mKey; }).reduce(function(s2,p){ return s2+(Number(p.monto)||0); },0);
    }, 0);
    var alDia = houses.filter(function(h){ return houseStatus(h)==='al-dia'; }).length;

    var statsHtml =
      '<div class="stats">'+
        '<div class="stat accent"><div class="label">Recaudado en total</div><div class="value tabular">'+fmtMoney(totalHist)+'</div><div class="sub">'+houses.length+' casa'+(houses.length===1?'':'s')+' registrada'+(houses.length===1?'':'s')+'</div></div>'+
        '<div class="stat"><div class="label">Recaudado '+escapeHtml(monthLabel(mKey))+'</div><div class="value tabular">'+fmtMoney(totalMes)+'</div><div class="sub">este mes</div></div>'+
        '<div class="stat"><div class="label">Casas al día</div><div class="value tabular">'+alDia+' / '+houses.length+'</div><div class="sub">'+(houses.length-alDia)+' pendiente'+((houses.length-alDia)===1?'':'s')+'</div></div>'+

    var sorted = houses.slice().sort(function(a,b){ return (a.numero||'').localeCompare(b.numero||'', 'es', {numeric:true}); });

    var selYear = ui.selectedYear;
    var mesesTranscurridosSel = monthsElapsedInYear(selYear);

            var confirmingDel = ui.confirmDeletePayment===p.id;
            return (
              '<div class="pay-row">'+
                '<span data-label="Fecha" class="tabular">'+dateLabel(p.fecha)+'</span>'+
                '<span data-label="Mes cubierto">'+escapeHtml(monthLabel(p.periodo))+'</span>'+
                '<span data-label="Monto" class="tabular">'+fmtMoney(p.monto)+'</span>'+
                '<span data-label="Nota" class="pay-note">'+escapeHtml(p.nota||'—')+'</span>'+
                (readOnly ? '<span></span>' :
                  '<span class="pay-del">'+
                    (confirmingDel
                      ? '<button type="button" class="btn btn-danger btn-sm" data-action="delete-payment" data-house="'+h.id+'" data-payment="'+p.id+'" title="Confirmar eliminar">Sí</button>'
                      : '<button type="button" class="btn btn-ghost btn-icon" data-action="arm-delete-payment" data-payment="'+p.id+'" title="Eliminar pago">'+ICON.trash+'</button>')+
                  '</span>')+
              '</div>'
            );
          }).join('')+
        '</div>';
    }

    var detailYear = ui.selectedYear;
    var mesesPagadosDetailYear = houseMonthsPaidInYear(h, detailYear);
    var yearDeleteRow;
    if(ui.confirmDeleteHouseYear && ui.confirmDeleteHouseYear.houseId===h.id && ui.confirmDeleteHouseYear.year===detailYear){
      yearDeleteRow =
        '<span class="hint">¿Eliminar todos los pagos de '+detailYear+' de "'+escapeHtml(h.numero)+'"? Los demás años no se ven afectados.</span>'+
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete-house-year" data-house="'+h.id+'" data-year="'+detailYear+'">Sí, eliminar</button>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-delete-house-year">Cancelar</button>';
    } else if(mesesPagadosDetailYear>0){
      yearDeleteRow = '<button type="button" class="btn btn-danger btn-sm" data-action="arm-delete-house-year" data-house="'+h.id+'" data-year="'+detailYear+'">'+ICON.trash+' Eliminar datos de '+detailYear+'</button>';
    } else {
      yearDeleteRow = '<span class="hint">No hay pagos registrados en '+detailYear+' para eliminar.</span>';
    }

    var dangerHtml = readOnly ? '' :
      '<div class="card card-pad" style="margin-top:1.5rem;">'+
        '<div class="confirm-row">'+ yearDeleteRow +'</div>'+
        '<div class="hint" style="margin-top:.5rem;">Cada casa es independiente por año: esto solo borra los pagos de '+detailYear+', el resto de los años se mantiene.</div>'+
        '<div style="border-top:1px solid var(--border);margin:1rem 0;"></div>'+
        '<div class="confirm-row">'+
          (ui.confirmDeleteHouse===h.id
            ? ('<span class="hint">¿Eliminar "'+escapeHtml(h.numero)+'" por completo, junto con TODO su historial de pagos en todos los años? Esta acción no se puede deshacer.</span>'+
               '<button type="button" class="btn btn-danger btn-sm" data-action="delete-house" data-house="'+h.id+'">Sí, eliminar todo</button>'+
               '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-delete-house">Cancelar</button>')
            : '<button type="button" class="btn btn-danger btn-sm" data-action="arm-delete-house" data-house="'+h.id+'">'+ICON.trash+' Eliminar casa completa (todos los años)</button>')+
        '</div>'+
      '</div>';

    return (
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">'+
        '<a href="#/" class="back-link" style="margin-bottom:1rem;">'+ICON.arrowLeft+' Volver al panel</a>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-action="logout">Cerrar sesión</button>'+
      '</div>'+
      '<div class="detail-head"><h1>'+escapeHtml(h.numero)+'</h1>'+statusPill(status)+'</div>'+
      '<div class="card card-pad">'+infoHtml+monthsStatusStrip(h, ui.selectedYear, true)+'</div>'+
      payFormHtml+
      historyHtml+
      dangerHtml
    );
  }

  /* ---------- reporte imprimible ---------- */
  function renderReporte(yearParam){
    var isYearMode = yearParam != null;
    var houses = STATE.houses.slice().sort(function(a,b){ return (a.numero||'').localeCompare(b.numero||'', 'es', {numeric:true}); });
    var gastos = (STATE.gastos||[]).slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });
    var ingresos = (STATE.ingresos||[]).slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });
    var years = availableYears();

    var switcherHtml =
      '<div class="no-print" style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;">'+
        '<a href="#/reporte" class="btn btn-sm '+(!isYearMode?'btn-primary':'btn-ghost')+'">Completo</a>'+
        years.map(function(y){
          return '<a href="#/reporte/'+y+'" class="btn btn-sm '+(isYearMode&&yearParam===y?'btn-primary':'btn-ghost')+'">'+y+'</a>';
        }).join('')+
      '</div>';

    var bodyHtml;
    if(isYearMode){
      var year = yearParam;
      var mesesTranscurridos = monthsElapsedInYear(year);
      var totalPagadoAnio = houses.reduce(function(s,h){ return s+housePaidInYear(h,year); }, 0);
      var totalEsperadoAnio = houses.reduce(function(s,h){ return s+houseExpectedToDate(h,year); }, 0);
      var diferenciaAnio = totalPagadoAnio - totalEsperadoAnio;
      var gastosAnio = gastos.filter(function(g){ return gastoYear(g)===String(year); });
      var totalGastosAnio = totalGastosList(gastosAnio);
      var ingresosAnio = ingresos.filter(function(g){ return ingresoYear(g)===String(year); });
      var totalIngresosAnio = totalIngresosList(ingresosAnio);
      var balanceAnio = totalPagadoAnio + totalIngresosAnio - totalGastosAnio;

      var alDiaN=0, pendN=0, sinN=0;
      houses.forEach(function(h){
        var mp = houseMonthsPaidInYear(h, year);
        if(mesesTranscurridos<=0 || mp<=0){ sinN++; }
        else if(mp>=mesesTranscurridos){ alDiaN++; }
        else { pendN++; }
      });

      var filasHtml = houses.map(function(h){
        var pagadoAnio = housePaidInYear(h, year);
        var esperadoAnio = houseExpectedToDate(h, year);
        var dif = pagadoAnio - esperadoAnio;
        var mp = houseMonthsPaidInYear(h, year);
        var statusLabel = (mesesTranscurridos<=0||mp<=0) ? 'Sin pagos' : (mp>=mesesTranscurridos ? 'Al día' : 'Pendiente');
        return (
          '<tr>'+
            '<td>'+escapeHtml(h.numero)+'</td>'+
            '<td>'+escapeHtml(h.responsable||'—')+'</td>'+
            '<td class="tabular">'+escapeHtml(formatRutDisplay(h.rut)||'—')+'</td>'+
            '<td class="tabular">'+fmtMoney(h.cuota)+'</td>'+
            '<td class="tabular">'+fmtMoney(pagadoAnio)+'</td>'+
            '<td class="tabular">'+fmtMoney(esperadoAnio)+'</td>'+
            '<td class="tabular'+(dif<0?' report-neg':'')+'">'+fmtMoney(dif)+'</td>'+
            '<td>'+statusLabel+'</td>'+
          '</tr>'
        );
      }).join('');

      var gastosFilasAnio = gastosAnio.map(function(g){
        return '<tr><td class="tabular">'+escapeHtml(dateLabel(g.fecha))+'</td><td>'+escapeHtml(g.concepto||'—')+'</td><td class="tabular">'+fmtMoney(g.monto)+'</td></tr>';
      }).join('');

      var ingresosFilasAnio = ingresosAnio.map(function(g){
        return '<tr><td class="tabular">'+escapeHtml(dateLabel(g.fecha))+'</td><td>'+escapeHtml(g.concepto||'—')+'</td><td class="tabular">'+fmtMoney(g.monto)+'</td></tr>';
      }).join('');

      var mesesLabelAnio = mesesTranscurridos<=0 ? 'aún no comienza' : ('enero a '+escapeHtml(monthLabel(year+'-'+pad(Math.min(mesesTranscurridos,12)))));

      bodyHtml =
        '<header class="report-head">'+
          '<h1>Cuotas del Barrio</h1>'+
          '<p>Reporte de cuotas vecinales '+year+' — generado el '+escapeHtml(dateLabel(todayISO()))+'</p>'+
        '</header>'+
        '<div class="report-summary">'+
          '<div><span class="k">Recaudado '+year+'</span><span class="v tabular">'+fmtMoney(totalPagadoAnio)+'</span></div>'+
          '<div><span class="k">Debería estar pagado a la fecha</span><span class="v tabular">'+fmtMoney(totalEsperadoAnio)+'</span></div>'+
          '<div><span class="k">Diferencia</span><span class="v tabular'+(diferenciaAnio<0?' report-neg':'')+'">'+fmtMoney(diferenciaAnio)+'</span></div>'+
          '<div><span class="k">Otros ingresos '+year+'</span><span class="v tabular">'+fmtMoney(totalIngresosAnio)+'</span></div>'+
          '<div><span class="k">Gastos '+year+'</span><span class="v tabular">'+fmtMoney(totalGastosAnio)+'</span></div>'+
          '<div><span class="k">Balance '+year+'</span><span class="v tabular'+(balanceAnio<0?' report-neg':'')+'">'+fmtMoney(balanceAnio)+'</span></div>'+
          '<div><span class="k">Casas al día</span><span class="v tabular">'+alDiaN+' / '+houses.length+'</span></div>'+
          '<div><span class="k">Casas pendientes</span><span class="v tabular">'+pendN+'</span></div>'+
          '<div><span class="k">Casas sin pagos</span><span class="v tabular">'+sinN+'</span></div>'+
        '</div>'+
        '<div class="hint" style="margin:.3rem 0 1rem;">"Debería estar pagado a la fecha" se calcula como la cuota mensual de cada casa multiplicada por los meses transcurridos de '+year+' ('+mesesLabelAnio+'). El balance suma lo recaudado por cuotas más otros ingresos, menos los gastos.</div>'+
        '<div style="overflow-x:auto;">'+
        '<table class="report-table">'+
          '<thead><tr><th>Casa</th><th>Responsable</th><th>RUT</th><th>Cuota</th><th>Pagado '+year+'</th><th>Esperado a la fecha</th><th>Diferencia</th><th>Estado</th></tr></thead>'+
          '<tbody>'+(filasHtml || '<tr><td colspan="8">No hay casas registradas.</td></tr>')+'</tbody>'+
        '</table>'+
        '</div>'+
        '<h2 style="font-size:1.05rem;margin:1.6rem 0 .6rem;">Otros ingresos de la asociación — '+year+'</h2>'+
        '<div style="overflow-x:auto;">'+
        '<table class="report-table">'+
          '<thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead>'+
          '<tbody>'+(ingresosFilasAnio || '<tr><td colspan="3">No hay ingresos registrados en '+year+'.</td></tr>')+'</tbody>'+
        '</table>'+
        '</div>'+
        '<h2 style="font-size:1.05rem;margin:1.6rem 0 .6rem;">Gastos de la asociación — '+year+'</h2>'+
        '<div style="overflow-x:auto;">'+
        '<table class="report-table">'+
          '<thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead>'+
          '<tbody>'+(gastosFilasAnio || '<tr><td colspan="3">No hay gastos registrados en '+year+'.</td></tr>')+'</tbody>'+
        '</table>'+
        '</div>';
    } else {
      var totalHistorico = houses.reduce(function(s,h){ return s + houseTotal(h); }, 0);
      var totalGastosHist = totalGastosList(gastos);
      var totalIngresosHist = totalIngresosList(ingresos);
      var balanceHist = totalHistorico + totalIngresosHist - totalGastosHist;
      var yearActual = currentYearNumber();
      var mesActual = currentMonthNumber();
      var mesActualLabel = monthLabel(yearActual+'-'+pad(mesActual));
      var totalPagadoEsteAnio = houses.reduce(function(s,h){ return s + housePaidInYear(h, yearActual); }, 0);
      var totalEsperado = houses.reduce(function(s,h){ return s + houseExpectedToDate(h, yearActual); }, 0);
      var diferencia = totalPagadoEsteAnio - totalEsperado;

      var alDia = houses.filter(function(h){ return houseStatus(h)==='al-dia'; });
      var pendientes = houses.filter(function(h){ return houseStatus(h)==='pendiente'; });
      var sinPagos = houses.filter(function(h){ return houseStatus(h)==='sin-pagos'; });

      var filasHtml = houses.map(function(h){
        var status = houseStatus(h);
        var statusLabel = status==='al-dia' ? 'Al día' : (status==='pendiente' ? 'Pendiente' : 'Sin pagos');
        return (
          '<tr>'+
            '<td>'+escapeHtml(h.numero)+'</td>'+
            '<td>'+escapeHtml(h.responsable||'—')+'</td>'+
            '<td class="tabular">'+escapeHtml(formatRutDisplay(h.rut)||'—')+'</td>'+
            '<td class="tabular">'+fmtMoney(h.cuota)+'</td>'+
            '<td class="tabular">'+fmtMoney(houseTotal(h))+'</td>'+
            '<td>'+statusLabel+'</td>'+
          '</tr>'
        );
      }).join('');

      var gastosFilasHist = gastos.map(function(g){
        return '<tr><td class="tabular">'+escapeHtml(dateLabel(g.fecha))+'</td><td>'+escapeHtml(g.concepto||'—')+'</td><td class="tabular">'+escapeHtml(gastoYear(g))+'</td><td class="tabular">'+fmtMoney(g.monto)+'</td></tr>';
      }).join('');

      var ingresosFilasHist = ingresos.map(function(g){
        return '<tr><td class="tabular">'+escapeHtml(dateLabel(g.fecha))+'</td><td>'+escapeHtml(g.concepto||'—')+'</td><td class="tabular">'+escapeHtml(ingresoYear(g))+'</td><td class="tabular">'+fmtMoney(g.monto)+'</td></tr>';
      }).join('');

      bodyHtml =
        '<header class="report-head">'+
          '<h1>Cuotas del Barrio</h1>'+
          '<p>Reporte completo (histórico) — generado el '+escapeHtml(dateLabel(todayISO()))+'</p>'+
        '</header>'+
        '<div class="report-summary">'+
          '<div><span class="k">Recaudado histórico</span><span class="v tabular">'+fmtMoney(totalHistorico)+'</span></div>'+
          '<div><span class="k">Otros ingresos histórico</span><span class="v tabular">'+fmtMoney(totalIngresosHist)+'</span></div>'+
          '<div><span class="k">Gastos histórico</span><span class="v tabular">'+fmtMoney(totalGastosHist)+'</span></div>'+
          '<div><span class="k">Balance histórico</span><span class="v tabular'+(balanceHist<0?' report-neg':'')+'">'+fmtMoney(balanceHist)+'</span></div>'+
          '<div><span class="k">Recaudado en '+yearActual+' (a '+escapeHtml(mesActualLabel)+')</span><span class="v tabular">'+fmtMoney(totalPagadoEsteAnio)+'</span></div>'+
          '<div><span class="k">Debería estar pagado a la fecha</span><span class="v tabular">'+fmtMoney(totalEsperado)+'</span></div>'+
          '<div><span class="k">Diferencia</span><span class="v tabular'+(diferencia<0?' report-neg':'')+'">'+fmtMoney(diferencia)+'</span></div>'+
          '<div><span class="k">Casas al día</span><span class="v tabular">'+alDia.length+' / '+houses.length+'</span></div>'+
          '<div><span class="k">Casas pendientes</span><span class="v tabular">'+pendientes.length+'</span></div>'+
          '<div><span class="k">Casas sin pagos</span><span class="v tabular">'+sinPagos.length+'</span></div>'+
        '</div>'+
        '<div class="hint" style="margin:.3rem 0 1rem;">Este reporte muestra el total histórico acumulado (todos los años). Usa los botones de arriba para ver el detalle de un año específico.</div>'+
        '<div style="overflow-x:auto;">'+
        '<table class="report-table">'+
          '<thead><tr><th>Casa</th><th>Responsable</th><th>RUT</th><th>Cuota</th><th>Pagado histórico</th><th>Estado actual</th></tr></thead>'+
          '<tbody>'+(filasHtml || '<tr><td colspan="6">No hay casas registradas.</td></tr>')+'</tbody>'+
        '</table>'+
        '</div>'+
        '<h2 style="font-size:1.05rem;margin:1.6rem 0 .6rem;">Otros ingresos de la asociación — histórico</h2>'+
        '<div style="overflow-x:auto;">'+
        '<table class="report-table">'+
          '<thead><tr><th>Fecha</th><th>Concepto</th><th>Año</th><th>Monto</th></tr></thead>'+
          '<tbody>'+(ingresosFilasHist || '<tr><td colspan="4">No hay ingresos registrados.</td></tr>')+'</tbody>'+
        '</table>'+
        '</div>'+
        '<h2 style="font-size:1.05rem;margin:1.6rem 0 .6rem;">Gastos de la asociación — histórico</h2>'+
        '<div style="overflow-x:auto;">'+
        '<table class="report-table">'+
          '<thead><tr><th>Fecha</th><th>Concepto</th><th>Año</th><th>Monto</th></tr></thead>'+
          '<tbody>'+(gastosFilasHist || '<tr><td colspan="4">No hay gastos registrados.</td></tr>')+'</tbody>'+
        '</table>'+
        '</div>';
    }

    return (
      '<div class="no-print" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem;">'+
        '<a href="#/" class="back-link" style="margin-bottom:0;">'+ICON.arrowLeft+' Volver al panel</a>'+
        '<button type="button" class="btn btn-primary btn-sm" data-action="print-report">'+ICON.printer+' Imprimir / Guardar como PDF</button>'+
      '</div>'+
      switcherHtml+
      '<div class="report-page">'+bodyHtml+'</div>'
    );
  }

  /* ---------- gastos de la asociación ---------- */
  function renderGastos(){
    var gastos = (STATE.gastos||[]).slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });
    var totalGeneral = totalGastosList(gastos);
    var selYear = ui.selectedYear;
    var gastosAnio = gastos.filter(function(g){ return gastoYear(g)===String(selYear); });
    var totalAnio = totalGastosList(gastosAnio);

    var addErr = (ui.formError && ui.formError.form==='add-gasto') ? ui.formError : null;
    var addVals = (addErr && addErr.values) ? addErr.values : {};

    var formHtml = readOnly ? '' :
      '<div class="card card-pad" style="margin-bottom:1.5rem;">'+
        '<h2 style="font-size:1rem;margin-bottom:.6rem;">Agregar gasto</h2>'+
        '<form data-action="add-gasto">'+
          '<div class="field-grid">'+
            '<div class="field"><label for="g-fecha">Fecha *</label><input id="g-fecha" name="fecha" type="date" required value="'+escapeHtml(addVals.fecha||todayISO())+'"></div>'+
            '<div class="field"><label for="g-concepto">Concepto *</label><input id="g-concepto" name="concepto" required placeholder="Ej: mantención áreas verdes" value="'+escapeHtml(addVals.concepto||'')+'"></div>'+
            '<div class="field"><label for="g-monto">Monto *</label><input id="g-monto" name="monto" type="number" min="0" step="1" required inputmode="numeric" placeholder="15000" value="'+escapeHtml(addVals.monto||'')+'"></div>'+
          '</div>'+
          (addErr ? '<div class="field-error">'+escapeHtml(addErr.message)+'</div>' : '')+
          '<div class="form-actions"><button type="submit" class="btn btn-primary">'+ICON.plus+' Agregar gasto</button></div>'+
        '</form>'+
      '</div>';

    var summaryHtml =
      '<div class="stats" style="margin-bottom:1.5rem;">'+
        '<div class="stat accent"><div class="label">Gastos histórico</div><div class="value tabular">'+fmtMoney(totalGeneral)+'</div><div class="sub">'+gastos.length+' registro'+(gastos.length===1?'':'s')+'</div></div>'+
        '<div class="stat"><div class="label">Gastos '+selYear+'</div><div class="value tabular">'+fmtMoney(totalAnio)+'</div><div class="sub" style="display:flex;align-items:center;gap:.4rem;">'+gastosAnio.length+' registro'+(gastosAnio.length===1?'':'s')+' · '+yearSwitcherHtml()+'</div></div>'+
      '</div>';

    var tableHtml;
    if(gastos.length===0){
      tableHtml = '<div class="empty"><p>Todavía no hay gastos registrados.</p></div>';
    } else {
      tableHtml =
        '<div class="gasto-table">'+
          '<div class="gasto-row head"><span>Fecha</span><span>Concepto</span><span>Monto</span><span></span></div>'+
          gastos.map(function(g){
            var confirmingDel = ui.confirmDeleteGasto===g.id;
            return (
              '<div class="gasto-row">'+
                '<span data-label="Fecha" class="tabular">'+dateLabel(g.fecha)+'</span>'+
                '<span data-label="Concepto">'+escapeHtml(g.concepto||'—')+'</span>'+
                '<span data-label="Monto" class="tabular">'+fmtMoney(g.monto)+'</span>'+
                (readOnly ? '<span></span>' :
                  '<span class="pay-del">'+
                    (confirmingDel
                      ? '<button type="button" class="btn btn-danger btn-sm" data-action="delete-gasto" data-gasto="'+g.id+'" title="Confirmar eliminar">Sí</button>'
                      : '<button type="button" class="btn btn-ghost btn-icon" data-action="arm-delete-gasto" data-gasto="'+g.id+'" title="Eliminar gasto">'+ICON.trash+'</button>')+
                  '</span>')+
              '</div>'
            );
          }).join('')+
        '</div>';
    }

    return (
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">'+
        '<a href="#/" class="back-link" style="margin-bottom:1rem;">'+ICON.arrowLeft+' Volver al panel</a>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-action="logout">Cerrar sesión</button>'+
      '</div>'+
      '<header class="topbar"><div class="brand"><h1>Gastos de la asociación</h1><p>Registro de gastos con fecha y año asociado</p></div></header>'+
      formHtml+
      summaryHtml+
      '<div class="section-head"><h2>Historial de gastos<span class="count-badge">'+gastos.length+'</span></h2></div>'+
      tableHtml
    );
  }

      '<div class="card card-pad" style="margin-bottom:1.5rem;">'+

        '<form data-action="add-ingreso">'+

  /* ---------- mutations ---------- */
  function touch(){ STATE.meta = STATE.meta || {}; STATE.meta.updatedAt = new Date().toISOString(); }

  function addHouse(data, rut){
    STATE.houses.push({
      id: uid(),
      numero: data.numero.trim(),
      rut: rut,
      direccion: (data.direccion||'').trim() || DEFAULT_DIRECCION,
      responsable: (data.responsable||'').trim(),
      telefono: (data.telefono||'').trim(),
      cuota: Number(data.cuota)||0,
      payments: []
    });
    touch();
  }
  function editHouse(id, data, rut){
    var h = getHouse(id); if(!h) return;
    h.numero = data.numero.trim();
    h.rut = rut;
    h.direccion = (data.direccion||'').trim();
    h.responsable = (data.responsable||'').trim();
    h.telefono = (data.telefono||'').trim();
    h.cuota = Number(data.cuota)||0;
    touch();
  }
  function deleteHouseById(id){
    STATE.houses = STATE.houses.filter(function(h){ return h.id!==id; });
    touch();
  }
  function deletePaymentsForYear(houseId, year){
    var h = getHouse(houseId); if(!h) return;
    var y = String(year);
    h.payments = (h.payments||[]).filter(function(p){ return (p.periodo||'').indexOf(y+'-')!==0; });
    touch();
  }
  function addPayment(houseId, data, periodos){
    var h = getHouse(houseId); if(!h) return;
    h.payments = h.payments || [];
    var amount = (data.monto===''||data.monto==null)
      ? (Number(h.cuota)||Number(STATE.meta&&STATE.meta.cuotaDefault)||0)
      : (Number(data.monto)||0);
    var nota = (data.nota||'').trim();
    periodos.forEach(function(periodo){
      h.payments.push({ id: uid(), fecha:data.fecha, periodo:periodo, monto:amount, nota:nota });
    });
    touch();
  }
  function quickPay(houseId){
    var h = getHouse(houseId); if(!h) return;
    h.payments = h.payments || [];
    h.payments.push({ id: uid(), fecha: todayISO(), periodo: currentMonthKey(), monto: Number(h.cuota)||0, nota:'' });
    touch();
  }
  function deletePayment(houseId, paymentId){
    var h = getHouse(houseId); if(!h) return;
    h.payments = (h.payments||[]).filter(function(p){ return p.id!==paymentId; });
    touch();
  }

  function toast(msg){

  /* ---------- detección de nueva versión publicada ---------- */
  // Si un vecino deja abierta la página de consulta (pública) y se publica una
  // versión nueva, la pestaña sigue mostrando el código viejo hasta que alguien
  // la recargue a mano. Para evitarlo, se revisa cada cierto tiempo (y cada vez
  // que la pestaña vuelve a estar visible) si la versión publicada cambió, y si
  // es así se recarga sola. Esto SOLO aplica a la consulta pública: el panel de
  // administración nunca se recarga solo, para no interrumpir una edición.
  var versionCheckInFlight = false;
  function isConsultaRoute(){
    return (location.hash||'').replace(/^#\/?/, '')==='consulta';
  }
  function isUserEditingSomething(){
    var el = document.activeElement;
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT')) return true;
    return !!(ui.addOpen || ui.editingHouse || ui.changePwOpen || ui.confirmDeleteHouse || ui.confirmDeletePayment ||
      ui.importPending || ui.confirmDeleteHouseYear || ui.confirmDeleteGasto || ui.confirmDeleteIngreso || ui.saving);
  }
  function checkForNewVersion(){
    if(!isConsultaRoute()) return; // el panel de administración no se autoactualiza
    if(versionCheckInFlight) return;
    versionCheckInFlight = true;
    var url = location.pathname + location.search;
    fetch(url, {cache:'no-store'}).then(function(resp){
      if(!resp.ok) return null;
      return resp.text();
    }).then(function(text){
      versionCheckInFlight = false;
      if(!text) return;
      if(!isConsultaRoute()) return; // se salió de la consulta mientras se revisaba
      var m = text.match(/var APP_VERSION\s*=\s*'([^']*)'/);
      if(!m || !m[1] || m[1]===APP_VERSION) return;
      if(isUserEditingSomething()) return; // se reintenta en el próximo ciclo
      toast('Hay una nueva versión disponible. Actualizando…');
      setTimeout(function(){ location.reload(); }, 1200);
    }).catch(function(){ versionCheckInFlight = false; });
  }
  function startVersionWatch(){
    setInterval(checkForNewVersion, 300000); // cada 5 minutos, mientras la pestaña esté abierta
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible'){ checkForNewVersion(); }
    });
  }

  /* ---------- backup export / import ---------- */
  function backupFilename(){
    return 'cuotas-barrio-respaldo-' + todayISO() + '.json';
  }
  function downloadViaBlob(filename, text){
    try{
      var blob = new Blob([text], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      toast('Respaldo descargado.');
    }catch(e){
      toast('No se pudo generar el archivo de respaldo en este navegador.');
    }
  }
  function exportData(){
    var filename = backupFilename();
    var json = JSON.stringify(STATE, null, 2);
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(dl){
        if(dl && typeof dl.save === 'function'){
          dl.save({ filename:filename, data:json }).then(function(){
            toast('Respaldo descargado.');
          }).catch(function(err){
            if(err && err.code === 'declined') return;
            downloadViaBlob(filename, json);
          });
        } else {
          downloadViaBlob(filename, json);
        }
      }).catch(function(){ downloadViaBlob(filename, json); });
    } else {
      downloadViaBlob(filename, json);
    }
  }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(err){
        ui.importError = 'El archivo no es un respaldo válido (JSON con formato incorrecto).';
        ui.importPending = null;
        render();
        return;
      }
      if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.houses)){
        ui.importError = 'El archivo no tiene el formato esperado de un respaldo de Cuotas del Barrio.';
        ui.importPending = null;
        render();
        return;
      }
      ui.importError = null;
      ui.importPending = parsed;
      render();
    };
    reader.onerror = function(){
      ui.importError = 'No se pudo leer el archivo seleccionado.';
      render();
    };
    reader.readAsText(file);
  }

  /* ---------- publish / persistence ---------- */
  function buildFullDocument(state){
    // Use fixed ids / document.title rather than querySelector('title'|'style'),
    // because the hosting page can inject its own <style> (a baseline reset)
    // into <head>: a bare querySelector('style') would grab THAT one instead
    // of ours and republish a page with no real styling at all.
    var titleTag = '<title>' + escapeHtml(document.title) + '</title>';
    var fontLink = document.getElementById('gfont-link').outerHTML;
    var styleEl = document.getElementById('app-styles');
    var styleTag = styleEl ? styleEl.outerHTML : (document.querySelector('style') ? document.querySelector('style').outerHTML : '');
    var stateJson = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      titleTag+'\n'+fontLink+'\n'+styleTag+'\n</head>\n<body>\n<div id="root"></div>\n'+
      '<script type="application/json" id="app-state">'+stateJson+'</'+'script>\n'+
      '<script>'+SCRIPT_TEXT+'</'+'script>\n</body>\n</html>';
  }

  function persist(){
    if(artifactNS && !readOnly){
      ui.saving = true; render();
      artifactNS.publish(buildFullDocument(STATE)).then(function(){
        /* view reloads automatically on success */
      }).catch(function(err){
        ui.saving = false;
        if(err && err.code === 'conflict'){ return; }
        if(err && (err.code==='not_writer' || err.code==='not_granted')){
          readOnly = true; render(); return;
        }
        saveLocalFallback(STATE);
        render();
        toast('No se pudo guardar en el panel compartido. Se guardó una copia en este navegador.');
      });
    } else if(!readOnly){
      saveLocalFallback(STATE);
      if(firebaseConfigured){
        ui.saving = true; render();
        writeFirebaseState().then(function(){
          ui.saving = false; firebaseOk = true; render();
        }).catch(function(){
          ui.saving = false; firebaseOk = false; render();
          toast('No se pudo sincronizar con la nube; se guardó una copia en este navegador.');
        });
      } else {
        if(fsHandle){ writeStateToLocalFile(); }
        render();
      }
    }
  }

  /* ---------- events ---------- */
  function formToObject(form){
    var out = {};
    Array.prototype.forEach.call(form.elements, function(el){
      if(el.name) out[el.name] = el.value;
    });
    return out;
  }

  document.addEventListener('submit', function(e){
    var form = e.target;
    if(!form.matches('[data-action]')) return;
    e.preventDefault();
    var action = form.getAttribute('data-action');
    var data = formToObject(form);
    if(action==='add-house'){
      var v = validateHouseForm(data, null);
      if(!v.ok){ ui.formError = { form:'add-house', message:v.message, values:data }; render(); return; }
      ui.formError = null;
      addHouse(data, v.rut);
      ui.addOpen = false;
      persist();
    } else if(action==='add-payment'){
      var houseId = form.getAttribute('data-house');
      var periodos = Array.prototype.map.call(form.querySelectorAll('input[name="periodos"]:checked'), function(el){ return el.value; });
      if(!data.fecha){ ui.formError = { form:'add-payment', message:'Ingresa la fecha de pago.', values:data, periodos:periodos }; render(); return; }
      if(periodos.length===0){ ui.formError = { form:'add-payment', message:'Selecciona al menos un mes que cubre el pago.', values:data, periodos:periodos }; render(); return; }
      if(data.monto!=='' && (isNaN(Number(data.monto)) || Number(data.monto)<0)){ ui.formError = { form:'add-payment', message:'El monto ingresado no es válido.', values:data, periodos:periodos }; render(); return; }
      ui.formError = null;
      addPayment(houseId, data, periodos);
      persist();
    } else if(action==='edit-house'){
      var hid = form.getAttribute('data-house');
      var v2 = validateHouseForm(data, hid);
      if(!v2.ok){ ui.formError = { form:'edit-house', message:v2.message, values:data }; render(); return; }
      ui.formError = null;
      editHouse(hid, data, v2.rut);
      ui.editingHouse = null;
      persist();
    } else if(action==='consulta-buscar'){
      var rutInput = data.rut || '';
      runConsultaSearch(rutInput);
      try{ sessionStorage.setItem(CONSULTA_LAST_RUT_KEY, rutInput); }catch(e){}
      render();
    } else if(action==='setup-password'){
      if(!data.password || data.password.length<4){ ui.authError = 'La contraseña debe tener al menos 4 caracteres.'; render(); return; }
      if(data.password !== data.confirm){ ui.authError = 'Las contraseñas no coinciden.'; render(); return; }
      sha256Hex(data.password).then(function(hash){
        if(!hash){ ui.authError = 'No se pudo crear la contraseña en este navegador.'; render(); return; }
        STATE.meta = STATE.meta || {};
        STATE.meta.adminPasswordHash = hash;
        auth.unlocked = true;
        try{ sessionStorage.setItem(AUTH_KEY, '1'); }catch(err){}
        ui.authError = null;
        persist();
      });
    } else if(action==='login-password'){
      sha256Hex(data.password||'').then(function(hash){
        if(hash && STATE.meta && hash===STATE.meta.adminPasswordHash){
          auth.unlocked = true;
          try{ sessionStorage.setItem(AUTH_KEY, '1'); }catch(err){}
          ui.authError = null;
          render();
        } else {
          ui.authError = 'Contraseña incorrecta.';
          render();
        }
      });
    } else if(action==='change-password'){
      if(!data.password || data.password.length<4){ ui.changePwError = 'La contraseña debe tener al menos 4 caracteres.'; render(); return; }
      if(data.password !== data.confirm){ ui.changePwError = 'Las contraseñas no coinciden.'; render(); return; }
      sha256Hex(data.password).then(function(hash){
        if(!hash){ ui.changePwError = 'No se pudo actualizar la contraseña en este navegador.'; render(); return; }
        STATE.meta = STATE.meta || {};
        STATE.meta.adminPasswordHash = hash;
        ui.changePwError = null;
        ui.changePwOpen = false;
        persist();
      });
    } else if(action==='set-cuota-default'){
      STATE.meta = STATE.meta || {};
      STATE.meta.cuotaDefault = Number(data.cuotaDefault)||0;
      touch();
      persist();
    } else if(action==='set-mensaje-general'){
      STATE.meta = STATE.meta || {};
      STATE.meta.mensajeGeneral = (data.mensajeGeneral||'').trim();
      touch();
      persist();
    } else if(action==='add-gasto'){
      if(!data.fecha){ ui.formError = { form:'add-gasto', message:'Ingresa la fecha del gasto.', values:data }; render(); return; }
      if(!data.concepto || !data.concepto.trim()){ ui.formError = { form:'add-gasto', message:'Ingresa un concepto para el gasto.', values:data }; render(); return; }
      if(data.monto==='' || isNaN(Number(data.monto)) || Number(data.monto)<0){ ui.formError = { form:'add-gasto', message:'Ingresa un monto válido.', values:data }; render(); return; }
      ui.formError = null;
      addGasto(data);
      persist();
    } else if(action==='add-ingreso'){
      if(!data.fecha){ ui.formError = { form:'add-ingreso', message:'Ingresa la fecha del ingreso.', values:data }; render(); return; }
      if(!data.concepto || !data.concepto.trim()){ ui.formError = { form:'add-ingreso', message:'Ingresa un concepto para el ingreso.', values:data }; render(); return; }
      if(data.monto==='' || isNaN(Number(data.monto)) || Number(data.monto)<0){ ui.formError = { form:'add-ingreso', message:'Ingresa un monto válido.', values:data }; render(); return; }
      ui.formError = null;
      addIngreso(data);
      persist();
    }
  });

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');

    if(action==='open-house'){
      if(e.target.closest('[data-stop]')) return;
      location.hash = '#/casa/' + encodeURIComponent(el.getAttribute('data-house'));
      return;
    }
    if(action==='toggle-add-form'){ ui.addOpen = !ui.addOpen; ui.formError = null; render(); return; }
    if(action==='quick-pay'){ quickPay(el.getAttribute('data-house')); persist(); return; }
    if(action==='start-edit-house'){ ui.editingHouse = el.getAttribute('data-house'); ui.formError = null; render(); return; }
    if(action==='cancel-edit-house'){ ui.editingHouse = null; ui.formError = null; render(); return; }
    if(action==='copy-consulta-link'){
      var link = el.getAttribute('data-link');
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(link).then(function(){
          toast('Enlace copiado al portapapeles.');
        }).catch(function(){ toast(link); });
      } else {
        toast(link);
      }
      return;
    }
    if(action==='arm-delete-house'){ ui.confirmDeleteHouse = el.getAttribute('data-house'); render(); return; }
    if(action==='cancel-delete-house'){ ui.confirmDeleteHouse = null; render(); return; }
    if(action==='delete-house'){
      var hid = el.getAttribute('data-house');
      deleteHouseById(hid);
      ui.confirmDeleteHouse = null;
      location.hash = '#/';
      persist();
      return;
    }
    if(action==='arm-delete-house-year'){
      ui.confirmDeleteHouseYear = { houseId: el.getAttribute('data-house'), year: Number(el.getAttribute('data-year')) };
      render();
      return;
    }
    if(action==='cancel-delete-house-year'){ ui.confirmDeleteHouseYear = null; render(); return; }
    if(action==='delete-house-year'){
      var hidY = el.getAttribute('data-house');
      var yr = Number(el.getAttribute('data-year'));
      deletePaymentsForYear(hidY, yr);
      ui.confirmDeleteHouseYear = null;
      persist();
      return;
    }
    if(action==='arm-delete-payment'){ ui.confirmDeletePayment = el.getAttribute('data-payment'); render(); return; }
    if(action==='delete-payment'){
      deletePayment(el.getAttribute('data-house'), el.getAttribute('data-payment'));
      ui.confirmDeletePayment = null;
      persist();
      return;
    }
    if(action==='toggle-change-pw'){ ui.changePwOpen = !ui.changePwOpen; ui.changePwError = null; render(); return; }
    if(action==='export-data'){ exportData(); return; }
    if(action==='trigger-import'){
      var inp = document.getElementById('import-file-input');
      if(inp) inp.click();
      return;
    }
    if(action==='cancel-import'){ ui.importPending = null; ui.importError = null; render(); return; }
    if(action==='connect-local-file'){ connectLocalFile(); return; }
    if(action==='reconnect-local-file'){ reconnectLocalFile(); return; }
    if(action==='disconnect-local-file'){ disconnectLocalFile(); return; }
    if(action==='confirm-import'){
      if(ui.importPending){
        STATE = ui.importPending;
        ui.importPending = null;
        ui.importError = null;
        touch();
        persist();
        toast('Datos restaurados desde el archivo de respaldo.');
      }
      return;
    }
    if(action==='logout'){
      try{ sessionStorage.removeItem(AUTH_KEY); }catch(e){}
      auth.unlocked = false;
      ui.authError = null;
      location.hash = '#/';
      render();
      return;
    }
    if(action==='print-report'){
      window.print();
      return;
    }
    if(action==='arm-delete-gasto'){ ui.confirmDeleteGasto = el.getAttribute('data-gasto'); render(); return; }
    if(action==='delete-gasto'){
      deleteGastoById(el.getAttribute('data-gasto'));
      ui.confirmDeleteGasto = null;
      persist();
      return;
    }
    if(action==='arm-delete-ingreso'){ ui.confirmDeleteIngreso = el.getAttribute('data-ingreso'); render(); return; }
    if(action==='delete-ingreso'){
      deleteIngresoById(el.getAttribute('data-ingreso'));
      ui.confirmDeleteIngreso = null;
      persist();
      return;
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(!t || !t.matches) return;
    if(t.matches('#import-file-input')){
      var file = t.files && t.files[0];
      t.value = '';
      if(!file) return;
      handleImportFile(file);
      return;
    }
    if(t.matches('[data-action="select-year"]')){
      var y = parseInt(t.value, 10);
      if(y){ ui.selectedYear = y; render(); }
      return;
    }
  });

  window.addEventListener('hashchange', function(){
    ui.editingHouse = null; ui.confirmDeleteHouse = null; ui.confirmDeletePayment = null; ui.formError = null;
    ui.authError = null; ui.changePwOpen = false; ui.changePwError = null;
    ui.importPending = null; ui.importError = null; ui.confirmDeleteGasto = null; ui.confirmDeleteIngreso = null; ui.confirmDeleteHouseYear = null;
    render();
  });

  /* ---------- boot ---------- */
  render();
  startVersionWatch();

  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(function(ns){
      artifactChecked = true;
      artifactNS = ns;
      if(!ns){
        var local = loadLocalFallback();
        if(local){ STATE = local; }
      }
      render();
    }).catch(function(){
      artifactChecked = true;
      artifactNS = null;
      render();
    });
    setTimeout(function(){
      if(!artifactChecked){ artifactChecked = true; artifactNS = null; render(); }
    }, 10500);
  } else {
    artifactChecked = true;
    initStandaloneData();
  }
})();
</script>

</body>
</html>
